name: Deploy Harumoa web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare verified Android download
        run: |
          mkdir -p site/downloads
          curl --fail --location --retry 3 --max-time 60 https://github.com/mudlbum/harumoa-web/releases/download/v0.9.34/harumoa-v0.9.34-unfinished-task-choices-test.apk --output site/downloads/harumoa-v0.9.34.apk
          printf '%s  %s\n' 'a736ee6d693096a730093da2c24363e4d2ddca85365847b810b271761f4192e3' 'harumoa-v0.9.34.apk' > site/downloads/SHA256SUMS.txt
          (cd site/downloads && sha256sum --check SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
